<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triqui - a tile level, movement and a jump</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="./examples/examples.css">
</head>
<body class="bg-body-tertiary">
<nav class="navbar bg-body border-bottom">
    <div class="container page">
        <a class="navbar-brand fw-semibold" href="./index.html">triqui</a>
        <!-- examples --><select class="form-select form-select-sm w-auto" aria-label="Examples" onchange="location.href = this.value"><option value="" selected disabled>examples</option><option value="./examples/minimal.html">minimal</option><option value="./examples/dom.html">dom</option><option value="./examples/tuning.html">tuning</option><option value="./examples/feel.html">feel</option><option value="./examples/oneway.html">one way</option><option value="./examples/dropthrough.html">drop through</option><option value="./examples/platforms.html">platforms</option><option value="./examples/airjump.html">air jumps</option><option value="./examples/wallslide.html">wall slide</option><option value="./examples/walljump.html">wall jump</option><option value="./examples/dash.html">dash</option><option value="./examples/glide.html">glide</option><option value="./examples/impulse.html">impulse</option><option value="./examples/gravity.html">gravity</option><option value="./examples/wrap.html">wrap</option><option value="./examples/pickups.html">pickups</option><option value="./examples/contacts.html">contacts</option><option value="./examples/crush.html">crush</option><option value="./examples/patrol.html">patrol</option><option value="./examples/chase.html">chase</option><option value="./examples/hurtbox.html">hurtbox</option><option value="./examples/shoot.html">shoot</option><option value="./examples/pool.html">pool</option></select><!-- /examples -->
    </div>
</nav>

<main class="container page py-4">
    <h1 class="h4 mb-2">A tile level, movement and a jump</h1>
    <p class="intro text-body-secondary">Two characters share one keyboard. Run with <kbd>A</kbd> <kbd>D</kbd> or the <kbd>arrow keys</kbd> and jump with <kbd>space</kbd>; holding the key gives a higher jump. <kbd>G</kbd> rotates gravity by a quarter turn. The characters collide with each other.</p>
    <p><button type="button" class="btn btn-outline-primary btn-sm" id="toggle">show rays</button></p>

    <div class="card shadow-sm overflow-hidden">
        <div class="card-header bg-body readout" id="readout"></div>
        <canvas id="view" width="800" height="480"></canvas>
    </div>
</main>

<script type="module" src="./game.js"></script>
</body>
</html>
