<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triqui - vertical screen wrap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="./examples.css">
</head>
<body class="bg-body-tertiary">
<nav class="navbar bg-body border-bottom">
    <div class="container page">
        <a class="navbar-brand fw-semibold" href="../index.html">triqui</a>
        <!-- examples --><select class="form-select form-select-sm w-auto" aria-label="Examples" onchange="location.href = this.value"><option value="../index.html">demo</option><option value="./minimal.html">minimal</option><option value="./tuning.html">tuning</option><option value="./shoot.html">shoot</option><option value="./glide.html">glide</option><option value="./hurtbox.html">hurtbox</option><option value="./pool.html">pool</option><option value="./feel.html">feel</option><option value="./chase.html">chase</option><option value="./patrol.html">patrol</option><option value="./dom.html">dom</option><option value="./contacts.html">contacts</option><option value="./platforms.html">platforms</option><option value="./oneway.html">one way</option><option value="./dropthrough.html">drop through</option><option value="./crush.html">crush</option><option value="./pickups.html">pickups</option><option value="./gravity.html">gravity</option><option value="./wallslide.html">wall slide</option><option value="./walljump.html">wall jump</option><option value="./airjump.html">air jumps</option><option value="./dash.html">dash</option><option value="./impulse.html">impulse</option><option value="./wrap.html" selected>wrap</option></select><!-- /examples -->
    </div>
</nav>

<main class="container page py-4">
    <h1 class="h4 mb-2">Vertical screen wrap</h1>
    <p class="intro text-body-secondary">A character that falls out of the bottom reappears at the top, in the same column and with the same velocity. The ring on the top left ledge cannot be reached by jumping; fall through the bottom in the right column to reach it. <kbd>R</kbd> resets.</p>

    <div class="card shadow-sm overflow-hidden">
        <div class="card-header bg-body readout" id="readout"></div>
        <canvas id="view" width="800" height="480"></canvas>
    </div>
</main>

<script type="module" src="./wrap.js"></script>
</body>
</html>
