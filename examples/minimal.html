        <!-- examples --><select class="form-select form-select-sm w-auto" aria-label="Examples" onchange="location.href = this.value"><option value="../index.html">demo</option><option value="./minimal.html" selected>minimal</option><option value="./tuning.html">tuning</option><option value="./shoot.html">shoot</option><option value="./glide.html">glide</option><option value="./hurtbox.html">hurtbox</option><option value="./pool.html">pool</option><option value="./feel.html">feel</option><option value="./chase.html">chase</option><option value="./patrol.html">patrol</option><option value="./dom.html">dom</option><option value="./contacts.html">contacts</option><option value="./platforms.html">platforms</option><option value="./oneway.html">one way</option><option value="./dropthrough.html">drop through</option><option value="./crush.html">crush</option><option value="./pickups.html">pickups</option><option value="./gravity.html">gravity</option><option value="./wallslide.html">wall slide</option><option value="./walljump.html">wall jump</option><option value="./airjump.html">air jumps</option><option value="./dash.html">dash</option><option value="./impulse.html">impulse</option><option value="./wrap.html">wrap</option></select><!-- /examples -->

<main class="container page py-4">
    <h1 class="h4 mb-2">Minimal setup</h1>
    <p class="intro text-body-secondary"><kbd>A</kbd> and <kbd>D</kbd> to run, <kbd>W</kbd> to jump; hold it for a higher jump. <kbd>S</kbd> is unused. <kbd>R</kbd> shows the rays cast by the collider in the last step: four from each leading face. The body stops at the nearest hit.</p>

    <div class="card shadow-sm overflow-hidden">
        <canvas id="view" width="640" height="384"></canvas>
    </div>
</main>
