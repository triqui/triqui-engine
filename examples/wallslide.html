<nav class="navbar bg-body border-bottom">

        <a class="navbar-brand fw-semibold" href="../index.html">triqui</a>
        <!-- examples --><select class="form-select form-select-sm w-auto" aria-label="Examples" onchange="location.href = this.value"><option value="./minimal.html">minimal</option><option value="./dom.html">dom</option><option value="./tuning.html">tuning</option><option value="./feel.html">feel</option><option value="./oneway.html">one way</option><option value="./dropthrough.html">drop through</option><option value="./platforms.html">platforms</option><option value="./airjump.html">air jumps</option><option value="./wallslide.html" selected>wall slide</option><option value="./walljump.html">wall jump</option><option value="./dash.html">dash</option><option value="./glide.html">glide</option><option value="./impulse.html">impulse</option><option value="./gravity.html">gravity</option><option value="./wrap.html">wrap</option><option value="./pickups.html">pickups</option><option value="./contacts.html">contacts</option><option value="./crush.html">crush</option><option value="./patrol.html">patrol</option><option value="./chase.html">chase</option><option value="./hurtbox.html">hurtbox</option><option value="./shoot.html">shoot</option><option value="./pool.html">pool</option></select><!-- /examples -->

<main class="container page py-4">
    <h1 class="h4 mb-2">Wall sliding</h1>
    <p class="intro text-body-secondary">Falling down the middle reaches the maximum fall speed. Pushing towards a wall limits the fall speed while the input is held. Wall jumps are disabled in this example. <kbd>R</kbd> resets the position.</p>

    <div class="card shadow-sm overflow-hidden">
        <div class="card-header bg-body readout" id="readout"></div>
        <canvas id="view" width="480" height="480"></canvas>
    </div>
</main>

<script type="module" src="./wallslide.js"></script>
