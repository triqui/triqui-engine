    <h1 class="h4 mb-2">One way platforms</h1>
    <p class="intro text-body-secondary">A tower of one way platforms with two rows of clearance. With solid floors every jump would hit the platform above. One way platforms do not block from below, so the character jumps through each one and lands on it.</p>

        <canvas id="view" width="480" height="480"></canvas>
