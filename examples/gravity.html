<main class="container page py-4">
    <h1 class="h4 mb-2">Rotating gravity</h1>
    <p class="intro text-body-secondary">Six plates are placed on the four walls. <kbd>G</kbd> rotates gravity by a quarter turn, and the character rotates with it. The run axis follows gravity, so the right key moves the character clockwise around the room.</p>

    <div class="card shadow-sm overflow-hidden">
        <div class="card-header bg-body readout" id="readout"></div>
        <canvas id="view" width="672" height="320"></canvas>
